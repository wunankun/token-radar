name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 离线校验 /api/pricing 解析
        run: node scripts/fetch-pricing.mjs --fixture tests/fixtures/newapi-pricing.json

      - name: 构建（warning 也算失败）
        run: node scripts/build.mjs --strict

      - name: 检查产物体积（单文件应 < 1MB）
        run: |
          size=$(wc -c < dist/index.html)
          echo "dist/index.html = ${size} bytes"
          test "$size" -lt 1048576
